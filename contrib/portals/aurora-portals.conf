# xdg-desktop-portal backends for XDG_CURRENT_DESKTOP=Aurora (see portals.conf(5); the file
# name is the lowercased desktop name). Installed to ~/.config/xdg-desktop-portal/ by
# scripts/install.sh.
#   ScreenCast, Screenshot  xdg-desktop-portal-wlr (its output chooser: xdg-desktop-portal-wlr(5))
#   Secret                  gnome-keyring (package gnome-keyring)
#   everything else         xdg-desktop-portal-gtk (file chooser, settings, ...)
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.Secret=gnome-keyring
