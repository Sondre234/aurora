[package]
name = "aurora-comp"
description = "Aurora Wayland compositor"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "aurora-comp"
path = "src/main.rs"

[dependencies]
tracing.workspace = true
tracing-subscriber.workspace = true
# Not used directly: enables the signals source in the calloop smithay re-exports.
calloop = { version = "0.14", features = ["signals"] }

[dependencies.smithay]
workspace = true
features = ["backend_winit", "wayland_frontend", "desktop"]
