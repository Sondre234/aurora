[package]
name = "aurora-comp"
description = "Aurora Wayland compositor"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "aurora-comp"
path = "src/main.rs"

[dependencies]
smithay-drm-extras.workspace = true
xcursor.workspace = true
libc.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
toml.workspace = true
aurora-layout.workspace = true
aurora-ipc.workspace = true
aurora-theme.workspace = true
# Not used directly: enables the signals source in the calloop smithay re-exports.
calloop = { version = "0.14", features = ["signals"] }
# GAMMA_LUT blobs of any length (the drm crate only builds blobs from sized types). Already in
# the tree through smithay's drm, same version.
drm-ffi = "0.9"

[dependencies.smithay]
workspace = true
features = [
    "backend_winit", "wayland_frontend", "desktop",
    "backend_drm", "backend_gbm", "backend_egl", "renderer_gl", "backend_libinput",
    "backend_udev", "backend_session_libseat", "renderer_pixman", "xwayland",
]

# Only for the `qa_display` example, a protocol client for scripts/qa-nested.sh. All already
# in the tree through smithay and the ui crate.
[dev-dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
