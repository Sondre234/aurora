[package]
name = "aurora-comp"
description = "Aurora Wayland compositor"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "aurora-comp"
path = "src/main.rs"

[dependencies]
smithay-drm-extras.workspace = true
xcursor.workspace = true
libc.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
toml.workspace = true
aurora-layout.workspace = true
# Not used directly: enables the signals source in the calloop smithay re-exports.
calloop = { version = "0.14", features = ["signals"] }

[dependencies.smithay]
workspace = true
features = [
    "backend_winit", "wayland_frontend", "desktop",
    "backend_drm", "backend_gbm", "backend_egl", "renderer_gl", "backend_libinput",
    "backend_udev", "backend_session_libseat", "renderer_pixman", "xwayland",
]
