[package]
name = "aurora-notifd"
description = "Aurora notification daemon: org.freedesktop.Notifications served over D-Bus, toasts as layer-shell surfaces"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "aurora_notifd"
path = "src/lib.rs"

[dependencies]
aurora-ui = { path = "../ui" }
aurora-ipc = { path = "../ipc" }
aurora-theme = { path = "../theme", default-features = false }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
png = "0.18"
tracing.workspace = true
tracing-subscriber.workspace = true
